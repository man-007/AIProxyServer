services:
  proxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy-gateway
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8080
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://integrate.api.nvidia.com}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}
      UPSTREAM_CLIENT: ${UPSTREAM_CLIENT:-httpx}
      MODEL_DISCOVERY_ENABLED: ${MODEL_DISCOVERY_ENABLED:-false}
      PROXY_AUTH_ENABLED: ${PROXY_AUTH_ENABLED:-false}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      REDIS_URL: ${REDIS_URL:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8080/health'); token = os.getenv('PROXY_API_KEY'); request.add_header('Authorization', 'Bearer ' + token) if token else None; urllib.request.urlopen(request)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
